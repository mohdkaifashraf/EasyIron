{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Login · EasyIron</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'store/css/dashboard.css' %}" rel="stylesheet">
</head>
<body class="store-login-page">
  <main class="login-card">
    <div class="login-brand"><span><i class="bi bi-water"></i></span><div>EasyIron<small>Store Console</small></div></div>
    <h1>Welcome back</h1><p>Sign in to manage orders and store operations.</p>
    {% if form.errors %}<div class="alert alert-danger">Your username or password is incorrect.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Username</label><input class="form-control" type="text" name="username" autofocus required>
      <label>Password</label><input class="form-control" type="password" name="password" required>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button class="btn store-btn-primary w-100" type="submit">Sign in <i class="bi bi-arrow-right"></i></button>
    </form>
    <a href="{% url 'home:homepage' %}"><i class="bi bi-arrow-left"></i> Back to EasyIron</a>
  </main>
</body>
</html>
