{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{% static 'css/style.css' %}" rel="stylesheet"></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="bg-white shadow-sm rounded-4 p-4"><p class="text-uppercase text-muted small">EasyIron store</p><h1 class="h3 mb-4">Store login</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label class="form-label">User ID</label><input class="form-control mb-3" name="username" required autofocus><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-brand w-100">Login</button></form></div></div></div></main></body></html>
