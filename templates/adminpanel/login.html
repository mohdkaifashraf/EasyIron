{% extends 'base.html' %}{% block title %}Admin Login{% endblock %}{% block content %}<main class="account-page"><section class="section-pad"><div class="container"><div class="row justify-content-center"><div class="col-md-5"><div class="bg-white shadow-sm rounded-4 p-4"><span class="eyebrow">EasyIron administration</span><h2 class="mt-2">Admin login</h2>{% if form.errors %}<div class="alert alert-danger">{{ form.non_field_errors|default:'Invalid admin credentials.' }}</div>{% endif %}<form method="post">{% csrf_token %}<label class="form-label">Username</label><input class="form-control mb-3" name="username" required autofocus><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-brand w-100">Sign in</button></form></div></div></div></div></section></main>{% endblock %}
