{% extends "base.html" %}
{% block title %}Create Delivery Agent · Admin · EasyIron{% endblock %}

{% block content %}
<main style="padding-top:90px;">
  <section class="section-pad">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-xl-9">
          <div class="auth-card p-4 shadow-sm bg-white rounded-4">
            <div class="section-heading text-center mb-4">
              <span class="eyebrow">Admin</span>
              <h2>Create Delivery Agent Account</h2>
              <p class="text-muted mb-0">Agent can login and manage pickups/deliveries.</p>
            </div>

            <form method="post">
              {% csrf_token %}

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Store*</label>
                  <select name="store" class="form-select" required>
                    {% for st in stores %}
                      <option value="{{ st.pk }}">{{ st.name }} ({{ st.code }})</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Name*</label>
                  <input class="form-control" name="name" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email*</label>
                  <input class="form-control" type="email" name="email" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone*</label>
                  <input class="form-control" name="phone" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Password*</label>
                  <input class="form-control" type="password" name="password" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Vehicle Type</label>
                  <select name="vehicle_type" class="form-select">
                    <option value="bicycle">Bicycle</option>
                    <option value="bike">Motorbike</option>
                    <option value="scooter">Scooter</option>
                    <option value="van">Van</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label">Vehicle Number</label>
                  <input class="form-control" name="vehicle_number">
                </div>
              </div>

              <div class="mt-4 d-flex gap-2 justify-content-end">
                <a class="btn btn-outline-secondary" href="{% url 'adminpanel:delivery_agent_list' %}">Cancel</a>
                <button class="btn btn-brand" type="submit">Create</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock %}
