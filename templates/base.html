{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EasyIron — professional laundry, ironing and garment care at your doorstep.">
  <title>{% block title %}EasyIron{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home:homepage' %}">
        <span class="logo-mark"><i class="bi bi-water"></i></span>Easy<span>Iron</span>
      </a>
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
        <i class="bi bi-list fs-2"></i>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link active" href="{% url 'home:homepage' %}#home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'home:homepage' %}#clothes">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'home:homepage' %}#track">Track Order</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'home:help_center' %}">Contact Us</a></li>
        </ul>
        <div class="nav-actions d-flex gap-2">
          <a href="#" class="btn btn-link text-decoration-none">Login</a>
          <a href="#" class="btn btn-brand">Sign Up</a>
          <button class="cart-button" data-bs-toggle="offcanvas" data-bs-target="#cartPanel" aria-label="Open cart">
            <i class="bi bi-bag"></i><span id="cartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
    <div class="offcanvas-header">
      <div><span class="eyebrow">Your basket</span><h4 class="mb-0">Laundry bag</h4></div>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="cartItems" class="flex-grow-1">
        <div class="empty-cart text-center py-5">
          <i class="bi bi-basket3"></i><p class="mt-3">Your laundry bag is empty.</p>
        </div>
      </div>
      <div class="cart-summary">
        <div class="d-flex justify-content-between mb-3"><strong>Subtotal</strong><strong id="cartTotal">₹0</strong></div>
        <button class="btn btn-brand w-100 py-3">Schedule pickup</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
